<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scroll Club Content Plan</title>

<link rel="manifest" href='data:application/manifest+json,{"name":"Scroll Club Content Plan","short_name":"Scroll Club","start_url":"./","display":"standalone","background_color":"%23f7f8fa","theme_color":"%231d5fc4"}'>
<meta name="theme-color" content="#1d5fc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scroll Club">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --line:#e9ebef; --line2:#d8dce3;
  --ink:#151922; --muted:#5f6673; --dim:#98a0ad;
  --brand:#1d5fc4; --accent-soft:#eaf1fd; --accent-line:#cfe0f8;
  --hover:#f5f7fa; --thead:#fafbfc; --sunken:#fafbfc;
  --cream:#eaf1fd; --creamdark:#cfe0f8; --btnink:#164a99;
  --hero-bg:#ffffff; --hero-ink:#151922; --hero-line:#e9ebef; --logo-bg:#1d5fc4; --logo-ink:#ffffff;
  --ok:#2e7d4f; --warn:#9a6a11; --bad:#c03a30;
  --ig:#c2453c; --tt:#111;
  --font:'Instrument Sans','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Instrument Sans','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --code:ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-micro:9.5px; --fs-xs:11px; --fs-sm:12px; --fs-base:13px;
  --fs-h3:12.5px; --fs-h2:15px; --fs-h1:17px; --fs-num:24px;
  --r:9px; --r-sm:6px; --r-lg:12px;
  --sh:0 1px 1px rgba(24,20,10,.03);
  --sh2:0 1px 2px rgba(24,20,10,.05),0 1px 1px rgba(24,20,10,.03);
  --shl:0 24px 56px -16px rgba(24,20,10,.3);
  --ring:0 0 0 3px color-mix(in oklab, var(--brand) 18%, transparent);
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:24px;
  --row-y:5px; --row-x:9px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:var(--fs-base);line-height:1.5;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-wrap:pretty}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d3d3dc;border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#b8b8c4;background-clip:padding-box}
*{scrollbar-width:thin;scrollbar-color:#d3d3dc transparent}

#app{display:grid;height:100vh;height:100dvh;grid-template-columns:212px 1fr;grid-template-rows:56px 1fr}
#side{grid-row:1/3;background:#fff;border-right:1px solid var(--line);padding:13px 10px;overflow-y:auto}
.sb{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.lg{width:34px;height:34px;border-radius:9px;background:var(--logo-bg);color:var(--logo-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.03em}
.sb .t{font-weight:650;font-size:13.5px;line-height:1.1;letter-spacing:-.012em}
.sb .s{font-size:9.5px;color:var(--dim)}
.nsec{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:12px 8px 5px}
.nav{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:var(--r-sm);color:var(--muted);font-size:var(--fs-sm);font-weight:450;margin-bottom:1px;position:relative;cursor:pointer}
.nav:hover{background:var(--hover)}
.nav.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--brand)}
.nav .ic{width:17px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.nav .ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.sbfoot{margin-top:auto;padding-top:12px}
.whoami{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 6px}
.whoami .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0}
.whoami .nm{font-size:12.5px;font-weight:700}
.whoami .role{font-size:10.5px;color:var(--dim)}

#top{grid-column:2;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.ptitle{font-size:var(--fs-h1);font-weight:650;letter-spacing:-.018em}
.psub{font-size:var(--fs-xs);color:var(--dim);margin-top:1px}
.tr{margin-left:auto;display:flex;align-items:center;gap:9px}
.srch input{width:190px;padding:6px 11px;border:1px solid var(--line);border-radius:20px;font-size:12px;outline:none;background:var(--sunken)}
.srch input:focus{border-color:var(--brand);background:#fff}
#main{grid-column:2;overflow-y:auto;padding:18px}

.btn{border:1px solid var(--brand);border-radius:var(--r-sm);padding:7px 12px;font-weight:600;font-size:var(--fs-sm);letter-spacing:-.005em;color:#fff;background:var(--brand)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-weight:500}
.btn.g:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:var(--fs-xs)}
.btn.mini{padding:3px 8px;font-size:10.5px;border-radius:var(--r-sm)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:default}
.inp{width:100%;padding:7px 9px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--ink);font-size:var(--fs-sm);outline:none}
.inp:focus{border-color:var(--brand);box-shadow:var(--ring)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.55}
.lbl{font-size:var(--fs-micro);color:var(--muted);margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.035em}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);box-shadow:none}
.panel h3{margin:0 0 3px;font-size:var(--fs-h3);font-weight:650;letter-spacing:-.012em}
.panel .desc{color:var(--dim);font-size:var(--fs-xs);margin-bottom:var(--s4)}
.shead{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.shead .grow{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:13px;flex-wrap:wrap}
.row>.panel{flex:1;min-width:300px}
.flex{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.divider{height:1px;background:var(--line);margin:13px 0}
.empty{text-align:center;color:var(--dim);padding:34px;font-size:12.5px}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
.kpi .l{font-size:var(--fs-micro);color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:var(--fs-num);font-weight:600;letter-spacing:-.03em;margin-top:var(--s2)}
.kpi .c{font-size:var(--fs-xs);color:var(--dim);margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.scrolltbl thead th{position:sticky;top:0;background:var(--panel);z-index:1}
th{text-align:left;color:var(--muted);font-weight:600;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.4px;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--thead)}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--hover)}

.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
.s-draft{background:#f1f1f5;color:#5a5a68}
.s-brief{background:#e9eefb;color:#2f4f9e}
.s-progress{background:#fdf2e0;color:#8f6415}
.s-review{background:#fcecf0;color:#9e3450}
.s-approved{background:#e6f4ea;color:#2c6b40}
.s-scheduled{background:#e6f3f7;color:#255f73}
.pl{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;font-size:9.5px;color:#fff;font-weight:700}
.p-ig{background:var(--ig)}.p-tt{background:var(--tt)}
.pill{display:inline-flex;font-size:10px;padding:2px 7px;border-radius:5px;background:var(--sunken);color:var(--muted);font-weight:500;white-space:nowrap;border:1px solid var(--line)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:4px 10px;font-size:var(--fs-xs);color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--accent-line);background:var(--hover);color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--btnink);font-weight:600}
.bar{height:6px;border-radius:20px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--brand)}

#modal{position:fixed;inset:0;background:rgba(20,20,40,.34);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:90;padding:16px;overflow-y:auto}
.sheet{width:880px;max-width:97vw;max-height:93vh;overflow-y:auto;background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shl)}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:5}
.sheet .hd h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.012em;flex:1}
.sheet .bd{padding:17px}
.sheet .ft{display:flex;gap:8px;justify-content:flex-end;padding:13px 17px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.x{margin-left:auto;background:transparent;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.field{margin-bottom:12px}

.wk{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:11px}
.wk h4{margin:0 0 9px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.wgrid{display:grid;grid-template-columns:100px repeat(5,1fr);gap:6px;font-size:11px}
.wcell{background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:7px;min-height:46px}
.wcell.hd2{background:var(--accent-soft);color:var(--muted);text-transform:uppercase;letter-spacing:.035em;font-weight:600;text-align:center;min-height:auto;padding:5px}
.wcell .wp{font-size:10.5px;font-weight:600;margin-bottom:2px}
.wcell.wtint{background:color-mix(in srgb,var(--wc) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--wc) 55%,var(--panel))}
.wcell.wtint .wp{color:color-mix(in srgb,var(--wc) 72%,var(--ink))}
.wrole{background:var(--sunken);border-radius:7px;padding:7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;justify-content:center;gap:3px}
.wrolename{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-family:inherit}

.calnav{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%}
.caldow{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding:3px;text-transform:uppercase;letter-spacing:.4px}
.calcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:104px;padding:6px;cursor:default;transition:.12s;min-width:0;overflow:hidden}
.calcell.crossmonth{opacity:.5}
.calcell.crossmonth .cdn{color:var(--dim)}
.calcell:hover{border-color:var(--accent-line);background:var(--hover)}
.calcell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#f5f8fe}
.calcell .cdn{font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:600}
.calcell.today .cdn{color:var(--brand)}
.calpill{font-size:9px;padding:2px 5px;border-radius:4px;margin-bottom:2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

.tlrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tlbrand{width:110px;flex-shrink:0;font-size:12px;font-weight:700}
.tltrack{flex:1;background:var(--sunken);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:5px}
.tlbar{height:22px;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer}

.ggallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.gcard .gimg{aspect-ratio:4/5;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:26px;position:relative}
.gcard .gimg img{width:100%;height:100%;object-fit:cover}
.gcard .gbody{padding:8px}
.gcard .gttl{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gmeta{font-size:9.5px;color:var(--dim);margin-top:1px}

.assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.assetcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.assetcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunken)}
.assetcard .acap{padding:7px;font-size:10.5px;color:var(--muted)}
.bankrow{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px}
.bankrow a{color:var(--brand);font-size:12px;word-break:break-all;text-decoration:none}
.bankrow a:hover{text-decoration:underline}
.bankrow .note{font-size:11.5px;color:var(--muted);margin-top:4px}

.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.setgrid{grid-template-columns:1fr}}

.tw{max-height:calc(100vh - 210px);overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);-webkit-overflow-scrolling:touch}
.tw table{min-width:1280px}
.tw th{position:sticky;top:0;z-index:2}
.tw tr.cycrow td{background:var(--accent-soft);color:var(--btnink);font-size:11px;font-weight:600;padding:7px 10px}
.tw td .cellinp{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit;color:var(--ink)}
.tw td .cellinp:hover{background:var(--hover);border-color:var(--line)}
.tw td .cellinp:focus{background:var(--panel);border-color:var(--brand);box-shadow:var(--ring)}
textarea.cellinp{resize:vertical;min-height:32px;line-height:1.4}
.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filterbar select{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r-sm);padding:5px 8px;font-size:11.5px;color:var(--muted)}
.iconbtn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r-sm);width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0}
.iconbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--bg)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toolgroup{display:flex;gap:6px;align-items:center}
.bdot{width:8px;height:8px;border-radius:3px;flex-shrink:0}

.trboard{display:flex;gap:12px;overflow-x:auto;padding:14px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px}
.trlist{background:#ebecf0;border-radius:10px;min-width:280px;max-width:280px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%}
.trlist-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 8px}
.trlist-head h4{margin:0;font-size:13px;font-weight:700;color:#172b4d}
.trlist-count{background:#dfe1e6;color:#5e6c84;font-size:11px;font-weight:700;border-radius:12px;padding:1px 8px}
.trcards{overflow-y:auto;padding:2px 10px 10px;display:flex;flex-direction:column;gap:8px}
.trcard{background:#fff;border-radius:8px;padding:9px 10px;box-shadow:0 1px 0 rgba(9,30,66,.25);cursor:pointer;transition:.12s;border:2px solid transparent;position:relative}
.trcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.trlabel{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:2.5px 8px;margin-bottom:7px}
.trplat{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:9px;color:#fff;font-weight:700;flex-shrink:0;position:absolute;top:8px;right:8px}
.trplat.p-ig{background:var(--ig)}
.trplat.p-tt{background:var(--tt)}
.trtitle{font-size:12.5px;font-weight:600;color:#172b4d;line-height:1.4;margin-bottom:8px;padding-right:24px}
.trfoot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.trbadge{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#5e6c84;background:#f4f5f7;border-radius:4px;padding:2.5px 6px;font-weight:600;white-space:nowrap}
.travatar{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.statusquick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:14px}
.btn.st-action{background:#eef0f3;border-color:#e1e4e9;color:#5b616e;transition:background .15s,border-color .15s,color .15s}
.btn.st-action:hover:not(:disabled){background:#e2e5eb;border-color:#d3d7df}
.btn.st-action.st-review:hover:not(:disabled){background:#e3edfe;border-color:#bfdbfe;color:#1d4ed8}
.btn.st-action.st-approved:hover:not(:disabled){background:#e3f7e9;border-color:#bceccb;color:#1e7d3d}
.btn.st-action.st-active.st-review{background:#dbeafe;border-color:#bfdbfe;color:#1d4ed8}
.btn.st-action.st-active.st-approved{background:#d7f5df;border-color:#bceccb;color:#1e7d3d}
.btn.st-action:disabled{cursor:default}
.commentbox{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:14px}
.commentitem{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;line-height:1.55}
.commentmeta{font-size:10px;font-weight:700;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.mention{color:var(--brand);font-weight:700;background:#eef2ff;padding:0 3px;border-radius:4px}
.mentionpopup{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);z-index:50;overflow:hidden;max-height:160px;overflow-y:auto}
.mentionitem{padding:7px 12px;font-size:12px;cursor:pointer}
.mentionitem:hover{background:var(--hover)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 17px;border-radius:9px;font-size:12.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.toast.bad{background:var(--bad)}
.errbox{background:#fdecea;color:#a83226;border-radius:8px;padding:9px 11px;font-size:12px;margin-bottom:12px}

.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}

/* =====================================================================
   STATE GLOBAL
   ===================================================================== */
let session = null;      // { user, profile:{id,name,role,team_role} }
let db = { brands: [], rows: [], comments: {}, settings: {}, bank: [], media: [] };
let S = { page: 'board', dashAudience: 'owner', loginErr: '', busy: false, mentionAt: -1 };
let CUR = null; // id konten yang lagi dibuka di modal

const STATUSES = {
  draft:'Draft', brief:'Brief Ready', review:'Content Review', approved:'Approved',
  progress:'Design / Production', scheduled:'Scheduled',
};
const TYPES_BY_PLAT = { ig:['IG Feeds','IG Story','IG Reels'], tt:['Video','Slide Photo'] };
const PILLARS = ['Entertain / Trend','Edukasi','Promosi','Testimoni','UGC','Interaksi','Styling / GRWM','Behind The Scenes'];
const TEAM_NAMES = ['Kim','Sajiya','Ajeng','Zia'];
const DAY_LABEL = { MONDAY:'Senin', TUESDAY:'Selasa', WEDNESDAY:'Rabu', THURSDAY:'Kamis', FRIDAY:'Jumat', SATURDAY:'Sabtu', SUNDAY:'Minggu' };

/* =====================================================================
   HELPER
   ===================================================================== */
function $(sel){ return document.querySelector(sel); }
function esc(s){ return (s??'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.style.background = bad?'#a83226':'#151922'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fd(d){ return d ? new Date(d+'T12:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'}) : '—'; }
function mondayOf(dateStr){ const x=new Date(dateStr+'T12:00'); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return isoDate(x); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function brandOf(id){ return db.brands.find(b=>b.id===id) || {id, name:id, color:'#888'}; }
function plTag(p){ return `<span class="trplat" style="position:static;display:inline-grid;width:19px;height:19px;background:${p==='tt'?'var(--tt)':'var(--ig)'}">${p==='tt'?'TT':'IG'}</span>`; }
function isOwner(){ return session?.profile?.role === 'owner'; }

/* =====================================================================
   AUTH
   ===================================================================== */
async function doLogin(email, password){
  S.busy = true; renderLogin();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  S.busy = false;
  if (error) { S.loginErr = 'Email atau password salah.'; renderLogin(); return; }
  await afterLogin(data.session);
}
async function doSignup(name, email, password, role){
  if (!name || !email || !password) { S.loginErr = 'Isi semua kolom dulu.'; renderLogin(); return; }
  S.busy = true; renderLogin();
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { S.busy=false; S.loginErr = 'Gagal daftar: '+error.message; renderLogin(); return; }
  if (!data.session) {
    // Kalau "Confirm email" masih nyala di project Supabase, gak ada sesi langsung.
    S.busy = false;
    S.loginErr = 'Akun dibuat tapi perlu konfirmasi email. Kalau ini gak diharapkan, matikan "Confirm email" di Supabase Dashboard > Authentication > Providers > Email, lalu coba daftar ulang.';
    S.mode = 'login'; renderLogin(); return;
  }
  const { error: perr } = await sb.from('profiles').insert({ id: data.user.id, name, role, team_role: null });
  S.busy = false;
  if (perr) { S.loginErr = 'Akun dibuat tapi gagal simpan profil: '+perr.message; renderLogin(); return; }
  await afterLogin(data.session);
}
async function afterLogin(sess){
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', sess.user.id).single();
  if (error || !prof) { S.loginErr = 'Akun ini belum terdaftar di sistem. Hubungi Kim.'; await sb.auth.signOut(); renderLogin(); return; }
  session = { user: sess.user, profile: prof };
  S.dashAudience = isOwner() ? 'owner' : 'tim';
  S.page = 'board';
  await loadAll();
}
async function doLogout(){
  await sb.auth.signOut();
  session = null;
  renderLogin();
}

/* =====================================================================
   LOAD DATA
   ===================================================================== */
async function loadAll(){
  const [{data:brands}, {data:rows}, {data:comments}, {data:settings}, {data:bank}, {data:media}] = await Promise.all([
    sb.from('brands').select('*').order('sort_order'),
    sb.from('content_rows').select('*').order('upload_date'),
    sb.from('content_comments').select('*').order('created_at'),
    sb.from('app_settings').select('*'),
    sb.from('content_bank').select('*').order('created_at',{ascending:false}),
    sb.from('media_assets').select('*').order('created_at',{ascending:false}),
  ]);
  db.brands = brands || [];
  db.rows = (rows||[]).map(r => ({
    id: r.id, brand: r.brand, platform: r.platform, type: r.type,
    briefDate: r.brief_date, uploadDate: r.upload_date, day: r.day, week: r.week,
    pillar: r.pillar, pic: r.pic, status: r.status, headline: r.headline||'',
    brief: r.brief||'', note: r.note||'', caption: r.caption||'', draft: r.draft_link||'',
    design: r.design||[], slides: r.slides||[],
  }));
  db.comments = {};
  (comments||[]).forEach(c => { (db.comments[c.content_id] ||= []).push({ id:c.id, by:c.by_name, text:c.text, ts:c.created_at }); });
  db.settings = {};
  (settings||[]).forEach(s => { db.settings[s.key] = s.value; });
  db.bank = (bank||[]).map(x=>({ id:x.id, brand:x.brand, url:x.url, note:x.note||'', ts:x.created_at }));
  db.media = (media||[]).map(x=>({ id:x.id, brand:x.brand, url:x.url, caption:x.caption||'', ts:x.created_at }));
  render();
}
async function saveSetting(key, value){
  db.settings[key] = value;
  const { error } = await sb.from('app_settings').upsert({ key, value });
  if (error) toast('Gagal simpan pengaturan: '+error.message, true);
}
function teamNames(){
  return db.settings.team_names || { planner:'Sajiya', creator:'Ajeng', designer:'Zia' };
}
function setTeamName(role, val){
  const t = { ...teamNames(), [role]: val };
  saveSetting('team_names', t);
}

/* =====================================================================
   CRUD
   ===================================================================== */
async function cellSetStatus(id, status){
  const { error } = await sb.from('content_rows').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) return toast('Gagal simpan: '+error.message, true);
  const r = db.rows.find(x=>x.id===id); if (r) r.status = status;
  render();
}
async function addComment(id){
  const ta = $('#commentText'); const txt = (ta?.value||'').trim();
  if (!txt) { toast('Tulis komentarnya dulu', true); return; }
  const by = $('#commentBy')?.value || session.profile.name;
  const { data, error } = await sb.from('content_comments').insert({ content_id:id, by_name:by, text:txt }).select().single();
  if (error) return toast('Gagal simpan: '+error.message, true);
  (db.comments[id] ||= []).push({ id:data.id, by:data.by_name, text:data.text, ts:data.created_at });
  render();
}
async function saveContentForm(id){
  const payload = {
    brand: $('#fBrand').value, platform: $('#fPlat').value, type: $('#fType').value || null,
    brief_date: $('#fBrief').value || null, upload_date: $('#fUp').value || null,
    day: $('#fDay').value || null, pillar: $('#fPillar').value || null, pic: $('#fPic').value || null,
    status: $('#fStatus').value, headline: $('#fHead').value.trim(), brief: $('#fBriefTxt').value,
    note: $('#fNote').value, caption: $('#fCap').value, draft_link: $('#fDraft').value,
    updated_at: new Date().toISOString(),
  };
  if (id) {
    const { error } = await sb.from('content_rows').update(payload).eq('id', id);
    if (error) return toast('Gagal simpan: '+error.message, true);
    Object.assign(db.rows.find(x=>x.id===id), {
      brand:payload.brand, platform:payload.platform, type:payload.type, briefDate:payload.brief_date,
      uploadDate:payload.upload_date, day:payload.day, pillar:payload.pillar, pic:payload.pic,
      status:payload.status, headline:payload.headline, brief:payload.brief, note:payload.note,
      caption:payload.caption, draft:payload.draft_link,
    });
  } else {
    const { data, error } = await sb.from('content_rows').insert(payload).select().single();
    if (error) return toast('Gagal simpan: '+error.message, true);
    db.rows.push({ id:data.id, brand:data.brand, platform:data.platform, type:data.type,
      briefDate:data.brief_date, uploadDate:data.upload_date, day:data.day, pillar:data.pillar,
      pic:data.pic, status:data.status, headline:data.headline, brief:data.brief, note:data.note,
      caption:data.caption, draft:data.draft_link, design:[], slides:[] });
  }
  toast('Tersimpan');
  closeModal(); render();
}
async function deleteContent(id){
  if (!confirm('Hapus konten ini?')) return;
  const { error } = await sb.from('content_rows').delete().eq('id', id);
  if (error) return toast('Gagal hapus: '+error.message, true);
  db.rows = db.rows.filter(x=>x.id!==id);
  closeModal(); render();
}

   RENDER — ROOT

};
const NAV_RINGKASAN = [
  { p:'board', label:'Board' }, { p:'flow', label:'Workflow' }, { p:'cal', label:'Kalender Konten' },
  { p:'tl', label:'Timeline' },
];

  { p:'bank', label:'Content Bank' },
];
function render(){
  if (!session) { renderLogin(); return; }
  const owner = isOwner();
  const navHtml = (p,label) => `<div class="nav ${S.page===p?'active':''}" onclick="S.page='${p}';render()"><span class="ic">${NAV_ICONS[p]}</span> ${label}</div>`;

    <div id="app">

        <div class="sb"><div class="lg">SC</div><div><div class="t">Scroll Club</div><div class="s">Content Plan</div></div></div>
        <div class="nsec">Ringkasan</div>
        ${owner?navHtml('dash','Dashboard'):''}
        ${NAV_RINGKASAN.map(n=>navHtml(n.p,n.label)).join('')}
        <div class="nsec">Brand</div>
        ${db.brands.map(b=>`<div class="nav ${S.page==='brand'&&S.brand===b.id?'active':''}" onclick="S.page='brand';S.brand='${b.id}';S.bFilter='all';S.bPage=1;render()">
          <span class="ic"><span class="bdot" style="background:${b.color};display:inline-block;width:9px;height:9px;border-radius:50%"></span></span> ${esc(b.name)}</div>`).join('')}

        ${NAV_ASET.map(n=>navHtml(n.p,n.label)).join('')}
        <div class="nsec">Lain-lain</div>
        ${NAV_LAIN.map(n=>navHtml(n.p,n.label)).join('')}
        ${navHtml('set','Pengaturan')}

function dashFilteredRows(){
  const mode = S.dashMode || 'all';
  if (mode === 'week') {
    const wk = S.dashWeek || mondayOf(isoDate(new Date()));
    return db.rows.filter(r => r.briefDate && mondayOf(r.briefDate) === wk);
  }
  const ym = (S.dashMonth || isoDate(new Date())).slice(0,7);
  let base = db.rows.filter(r => r.uploadDate && r.uploadDate.slice(0,7) === ym);
  if (mode === 'brand') { const b = S.dashBrand || db.brands[0]?.id; base = base.filter(r => r.brand === b); }
  return base;
}
function dashShiftMonth(dir){ const cur = S.dashMonth||isoDate(new Date()); const d=new Date(cur+'T12:00'); d.setMonth(d.getMonth()+dir,1); S.dashMonth=isoDate(d); render(); }
function dashShiftWeek(dir){ const wk = S.dashWeek||mondayOf(isoDate(new Date())); S.dashWeek = isoDate(addDays(new Date(wk+'T12:00'), dir*7)); render(); }
function monthLabel(ymDate){ return new Date(ymDate+'T12:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'}); }
/* Panel "Per brand": selalu nunjukkin siklus 2 mingguan yang lagi jalan/berikutnya buat brand itu,
   bukan total keseluruhan — dikelompokkan sama persis kayak baris pemisah siklus di tabel brand. */
function brandCurrentPeriod(brandId){
  const rows = db.rows.filter(r => r.brand===brandId && r.uploadDate);
  const groups = {};
  rows.forEach(r => { const key = r.briefDate ? mondayOf(r.briefDate) : ('nokey-'+r.uploadDate); (groups[key] ||= []).push(r); });
  const list = Object.values(groups).map(rs => {
    const us = rs.reduce((m,x)=> !m||x.uploadDate<m ? x.uploadDate : m, '');
    const ue = rs.reduce((m,x)=> !m||x.uploadDate>m ? x.uploadDate : m, '');
    return { rows: rs, us, ue };
  }).sort((a,b)=>a.us.localeCompare(b.us));
  const today = isoDate(new Date());
  return list.find(g => g.ue >= today) || list[list.length-1] || { rows:[], us:'', ue:'' };
}

/* =====================================================================
   KALENDER KONTEN — tampilan bulanan
   ===================================================================== */
function mondayOfDate(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }
function renderCalendar(){
  $('#ptitle').textContent = 'Kalender Konten';
  $('#psub').textContent = 'Semua brand, satu tampilan bulanan';
  const view = S.calView || 'month';
  const d = S.calDate || (S.calDate = new Date());
  const y = d.getFullYear(), m = d.getMonth();
  const wkStart = mondayOfDate(d);
  const twoWkEnd = addDays(wkStart, 13);
  const rangeLbl = view === '2w'
    ? `${wkStart.getDate()} ${wkStart.toLocaleDateString('id-ID',{month:'short'})} – ${twoWkEnd.getDate()} ${twoWkEnd.toLocaleDateString('id-ID',{month:'short'})} ${twoWkEnd.getFullYear()}`
    : d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const today = isoDate(new Date());
  const rowsAll = db.rows.filter(r => (!S.calBrand||S.calBrand==='all'||r.brand===S.calBrand) && (!S.calPlat||S.calPlat==='all'||r.platform===S.calPlat));

  let cells = [];
  if (view === '2w') {
    for (let i=0;i<14;i++){ const dt = addDays(wkStart,i); cells.push({ d:dt.getDate(), iso:isoDate(dt), crossMonth: dt.getMonth()!==m }); }
  } else {
    const first = new Date(y,m,1); let start = first.getDay(); start = start===0?6:start-1;
    const days = new Date(y,m+1,0).getDate(), prev = new Date(y,m,0).getDate();
    for (let i=start-1;i>=0;i--) cells.push({ d:prev-i, dim:true });
    for (let i=1;i<=days;i++) cells.push({ d:i, iso:`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}` });
    let nx=1; while (cells.length % 7) cells.push({ d:nx++, dim:true });
  }

  $('#view').innerHTML = `
    <div class="calnav">
      <button class="btn g sm" onclick="calMove(-1)">‹</button>
      <h3 style="margin:0;font-size:15px;min-width:150px">${rangeLbl}</h3>
      <button class="btn g sm" onclick="calMove(1)">›</button>
      <button class="btn g sm" onclick="S.calDate=new Date();render()">Hari ini</button>
      <div class="segwrap">
        <button class="seg ${view==='month'?'on':''}" onclick="setCalView('month')">1 Bulan</button>
        <button class="seg ${view==='2w'?'on':''}" onclick="setCalView('2w')">2 Minggu</button>
      </div>
      <div class="grow"></div>
      <div class="chips">
        <span class="chip ${(!S.calBrand||S.calBrand==='all')?'on':''}" onclick="S.calBrand='all';render()">Semua brand</span>
        ${db.brands.map(b=>`<span class="chip ${S.calBrand===b.id?'on':''}" onclick="S.calBrand='${b.id}';render()">${esc(b.name)}</span>`).join('')}
      </div>
      <div class="chips">
        <span class="chip ${(!S.calPlat||S.calPlat==='all')?'on':''}" onclick="S.calPlat='all';render()">Semua platform</span>
        <span class="chip ${S.calPlat==='ig'?'on':''}" onclick="S.calPlat='ig';render()">Instagram</span>
        <span class="chip ${S.calPlat==='tt'?'on':''}" onclick="S.calPlat='tt';render()">TikTok</span>
      </div>
    </div>
    <div class="calgrid" style="margin-bottom:7px">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="caldow">${x}</div>`).join('')}</div>
    <div class="calgrid ${view==='2w'?'cal2w':''}">
      ${cells.map(c=>{
        if (c.dim) return `<div class="calcell dim2"><div class="cdn">${c.d}</div></div>`;
        const evs = rowsAll.filter(r=>r.uploadDate===c.iso);
        const isToday = c.iso===today;
        const open = S.calOpen === c.iso;
        const byBrand = [];

function renderCommentText(text){

function onCommentInput(el){
  const pos = el.selectionStart, before = el.value.slice(0,pos);
  const m = before.match(/(?:^|\s)@([a-zA-Z]*)$/);
  const popup = $('#mentionPopup');
  if (m) {
    const q = m[1].toLowerCase();
    const matches = TEAM_NAMES.filter(n=>n.toLowerCase().startsWith(q));
    if (matches.length) {
      S.mentionAt = pos - m[1].length - 1;
      popup.innerHTML = matches.map(n=>`<div style="padding:7px 12px;font-size:12px;cursor:pointer" onmousedown="event.preventDefault();insertMention('${n}')">@${n}</div>`).join('');
      popup.style.display = 'block'; return;
    }
  }
  popup.style.display = 'none'; S.mentionAt = -1;
}
function insertMention(name){
  const el = $('#commentText'); if (!el || S.mentionAt<0) return;
  const pos = el.selectionStart;
  const before = el.value.slice(0, S.mentionAt), after = el.value.slice(pos);
  const inserted = before + '@' + name + ' ';
  el.value = inserted + after; el.focus(); el.setSelectionRange(inserted.length, inserted.length);
  $('#mentionPopup').style.display = 'none'; S.mentionAt = -1;
}
function onCommentKeydown(e, id){
  const popup = $('#mentionPopup');

  if (e.key==='Enter' && !e.shiftKey && popup?.style.display!=='block'){ e.preventDefault(); addComment(id); }
}

  // disimpan di environment variable Vercel, TIDAK PERNAH dikirim ke browser.
  const body = { messages };
  if (tools) body.tools = tools;
  const res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)

  if (!res.ok) throw new Error('AI request gagal ('+res.status+'). Pastikan ANTHROPIC_API_KEY sudah di-set di Vercel.');

}

const TIMELINE_FLOOR = '2026-08-17';
const GANTT_DAYS = 365, GANTT_DAYPX = 36;
function oppositeBrands(brands){ return brands.includes('KURIIN') ? ['TEKNIKIT','PODOMURAH'] : ['KURIIN','SFM']; }
function contentPlanBlocksForBrand(brandId){
  return ZIA_SCHEDULE.filter(z=>oppositeBrands(z.brands).includes(brandId)).map(z=>{
    const ps = new Date(z.workStart+'T00:00'); ps.setDate(ps.getDate()+14);

}
function packLanes(items){
  const sorted = [...items].sort((a,b)=>a.start.localeCompare(b.start));
  const laneEnds = [], laneOf = {};
  sorted.forEach(it=>{ let placed=-1; for (let i=0;i<laneEnds.length;i++){ if (it.start>laneEnds[i]){ placed=i; break; } }
    if (placed===-1){ placed=laneEnds.length; laneEnds.push(it.end); } else laneEnds[placed]=it.end;
    laneOf[it.id]=placed; });
  return { laneOf, count: laneEnds.length };
}
function scheduleAnchorDate(){
  const dates = [...ZIA_SCHEDULE.map(z=>z.periodStart), ...db.rows.map(r=>r.uploadDate).filter(Boolean)].sort();
  if (!dates.length) return new Date();
  const first = new Date(dates[0]+'T00:00'), last = new Date(dates[dates.length-1]+'T00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return (now>=first && now<=last) ? now : first;
}
function ganttWindowStart(){
  const anchor = scheduleAnchorDate();
  const now = new Date(); now.setHours(0,0,0,0);
  const isRealToday = anchor.getTime()===now.getTime();
  const d = new Date(anchor); d.setDate(d.getDate() - (isRealToday?60:0)); d.setHours(0,0,0,0);
  const floor = new Date(TIMELINE_FLOOR+'T00:00');
  return d<floor ? floor : d;
}
function todayMarkerStyle(winStart, totalDays){
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = (today-winStart)/86400000;
  if (diff<0 || diff>totalDays) return '';
  return `<div class="gtoday" style="left:${diff*GANTT_DAYPX}px"></div>`;
}
function ganttBarPos(bl, winStart){
  const bs = new Date(bl.start+'T00:00'), be = new Date(bl.end+'T00:00');
  const left = (bs-winStart)/86400000*GANTT_DAYPX;
  const span = Math.max(1, (be-bs)/86400000+1);
  return { left, width: Math.max(GANTT_DAYPX, span*GANTT_DAYPX) };
}
function setTlShow(v){ S.tlShow=v; render(); }
function jumpToBrandDate(brandId, dateISO){
  const rows = db.rows.filter(r=>r.brand===brandId).sort((a,c)=>(a.uploadDate||'').localeCompare(c.uploadDate||''));
  const cycleKeyOf = r=>r.briefDate?mondayOf(r.briefDate):'';
  const cycleStarts = [];
  rows.forEach((r,i)=>{ if (i===0||cycleKeyOf(r)!==cycleKeyOf(rows[i-1])) cycleStarts.push(i); });
  let idx = rows.findIndex(r=>(r.uploadDate||'')>=dateISO);
  if (idx===-1) idx = rows.length-1;
  let page = 1;
  cycleStarts.forEach((start,gi)=>{ if (idx>=start) page = gi+1; });
  S.page='brand'; S.brand=brandId; S.bPage=page; S.bFilter='all';
  render();
}

    <div class="pagebar">
      <button ${S.bPage<=1?'disabled':''} onclick="S.bPage=1;render()">« Awal</button>
      <button ${S.bPage<=1?'disabled':''} onclick="S.bPage--;render()">‹ Siklus sebelumnya</button>
      <span class="pnum">Siklus ${S.bPage} dari ${totalPages} <span class="dim">(${pageRows.length} konten)</span></span>
      <button ${S.bPage>=totalPages?'disabled':''} onclick="S.bPage++;render()">Siklus berikutnya ›</button>
      <button ${S.bPage>=totalPages?'disabled':''} onclick="S.bPage=${totalPages};render()">Akhir »</button>
    </div>` : ''}`;
}
/* Baris pemisah siklus: satu brief mingguan menghasilkan 14 hari upload, jadi ditampilkan sekali
   di batas siklus (bukan per baris). Dikenali dari Senin minggu brief-nya. */
function cycleBanner(rows, i){
  const r = rows[i];
  const key = r.briefDate ? mondayOf(r.briefDate) : '';
  if (i > 0) { const prevKey = rows[i-1].briefDate ? mondayOf(rows[i-1].briefDate) : ''; if (prevKey === key) return ''; }
  const same = rows.filter(x => (x.briefDate ? mondayOf(x.briefDate) : '') === key);
  const byType = {};
  same.forEach(x => { if (x.type) byType[x.type] = (byType[x.type]||0) + 1; });
  const parts = Object.entries(byType).map(([t,n])=>`${n} ${t}`);
  const outputTxt = parts.length ? `Output : ${parts.join('  |  ')}` : '';
  if (!key) return `<tr class="cycrow"><td colspan="11"><div class="cycin">
      <span class="cycleft"><span class="cyctag">TANPA BRIEF</span><span class="dim">Konten ini belum punya tanggal brief</span></span>
      <span class="cyccnt">${outputTxt}</span></div></td></tr>`;
  const bs = same.reduce((m,x)=> !m||x.briefDate<m ? x.briefDate : m, '');
  const be = same.reduce((m,x)=> !m||x.briefDate>m ? x.briefDate : m, '');
  const us = same.reduce((m,x)=> !m||x.uploadDate<m ? x.uploadDate : m, '');
  const ue = same.reduce((m,x)=> !m||x.uploadDate>m ? x.uploadDate : m, '');
  return `<tr class="cycrow"><td colspan="11"><div class="cycin">
    <span class="cycleft"><span>Brief <b>${fd(bs)} – ${fd(be)}</b></span><span class="cycarrow">→</span><span>tayang <b>${fd(us)} – ${fd(ue)}</b></span></span>
    <span class="cyccnt">${outputTxt}</span></div></td></tr>`;
}
